<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zuno Social Media</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        button {
            cursor: pointer;
        }

        /* AUTH PAGE */

        #authPage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .auth-logo {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .auth-card h2 {
            margin-bottom: 20px;
        }

        .auth-card input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .auth-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            background: #1877f2;
            color: white;
            font-size: 17px;
        }

        .switch-btn {
            margin-top: 18px;
            border: none;
            background: none;
            color: #1877f2;
            font-size: 15px;
        }

        /* HOME */

        #homePage {
            display: none;
        }

        header {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .profile-btn {
            border: none;
            background: none;
            font-size: 25px;
        }

        .post-box,
        .post {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
        }

        .create-btn,
        .comment-btn,
        .edit-profile,
        .save-profile,
        .follow-btn,
        .logout-btn {
            margin-top: 10px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .create-btn,
        .comment-btn,
        .save-profile,
        .follow-btn {
            background: #1877f2;
            color: white;
        }

        .logout-btn {
            background: #e53935;
            color: white;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }

        .actions button {
            border: none;
            background: none;
            font-size: 16px;
        }

        .comment-box {
            display: none;
            margin-top: 12px;
        }

        .comment {
            background: #f2f2f2;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
        }

        /* PROFILE */

        .profile-page {
            display: none;
            position: fixed;
            inset: 0;
            background: #f2f2f2;
            z-index: 1000;
            overflow-y: auto;
        }

        .back-btn {
            margin: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: white;
            font-size: 16px;
        }

        .profile-card {
            background: white;
            margin: 15px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .avatar {
            font-size: 70px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }

        .profile-stats div {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .profile-editor {
            display: none;
            margin-top: 25px;
            text-align: left;
        }

        .profile-editor label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .profile-editor input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

    </style>

</head>

<body>


<!-- =========================
     LOGIN / SIGN UP
========================= -->

<div id="authPage">

    <div class="auth-card">

        <div class="auth-logo">
            Zuno
        </div>

        <p>
            आपका Social Media 🚀
        </p>


        <!-- LOGIN -->

        <div id="loginBox">

            <h2>
                Login
            </h2>

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
            >

            <button
                class="auth-btn"
                onclick="login()"
            >
                🔐 Login
            </button>

            <button
                class="switch-btn"
                onclick="showSignup()"
            >
                नया account बनाएँ
            </button>

        </div>


        <!-- SIGN UP -->

        <div
            id="signupBox"
            style="display:none;"
        >

            <h2>
                Create Account
            </h2>

            <input
                id="signupName"
                type="text"
                placeholder="आपका Name"
            >

            <input
                id="signupEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="signupPassword"
                type="password"
                placeholder="Password"
            >

            <button
                class="auth-btn"
                onclick="signup()"
            >
                🚀 Sign Up
            </button>

            <button
                class="switch-btn"
                onclick="showLogin()"
            >
                पहले से account है? Login
            </button>

        </div>

    </div>

</div>


<!-- =========================
     HOME PAGE
========================= -->

<div id="homePage">


    <!-- HEADER -->

    <header>

        <div class="logo">
            Zuno
        </div>

        <div>

            🔔

            <button
                class="profile-btn"
                onclick="openProfile()"
            >
                👤
            </button>

        </div>

    </header>


    <!-- CREATE POST -->

    <div class="post-box">

        <strong>
            क्या चल रहा है?
        </strong>

        <textarea
            id="postText"
            rows="3"
            placeholder="अपनी पोस्ट लिखें..."
        ></textarea>

        <button
            class="create-btn"
            onclick="createPost()"
        >
            ➕ Create Post
        </button>

    </div>


    <!-- POSTS -->

    <div id="posts">

        <div class="post">

            <strong>
                👤 Zuno
            </strong>

            <p>
                🎉 Welcome to Zuno!
            </p>

            <div class="actions">

                <button class="like-btn">
                    ❤️ Like
                </button>

                <button class="comment-open">
                    💬 Comment
                </button>

                <button>
                    ↗️ Share
                </button>

            </div>

            <div class="comment-box">

                <textarea
                    rows="2"
                    placeholder="Comment लिखें..."
                ></textarea>

                <button class="comment-btn">
                    Post Comment
                </button>

                <div class="comments"></div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     PROFILE PAGE
========================= -->

<div
    id="profilePage"
    class="profile-page"
>

    <button
        class="back-btn"
        onclick="closeProfile()"
    >
        ← वापस
    </button>


    <div class="profile-card">

        <div class="avatar">
            👤
        </div>


        <h2 id="profileName">
            Zuno User
        </h2>


        <p id="profileBio">
            Welcome to my Zuno profile! 🎉
        </p>


        <div class="profile-stats">

            <div>
                <strong id="postCount">0</strong>
                <span>Posts</span>
            </div>

            <div>
                <strong id="followersCount">0</strong>
                <span>Followers</span>
            </div>

            <div>
                <strong id="followingCount">0</strong>
                <span>Following</span>
            </div>

        </div>


        <!-- FOLLOW -->

        <button
            id="followBtn"
            class="follow-btn"
            onclick="toggleFollow()"
        >
            👥 Follow
        </button>


        <br>


        <!-- EDIT PROFILE -->

        <button
            class="edit-profile"
            onclick="showProfileEditor()"
        >
            ✏️ Edit Profile
        </button>


        <!-- PROFILE EDITOR -->

        <div
            id="profileEditor"
            class="profile-editor"
        >

            <label>
                आपका Name
            </label>

            <input
                id="nameInput"
                type="text"
                placeholder="अपना नाम लिखें"
            >


            <label>
                आपका Bio
            </label>

            <textarea
                id="bioInput"
                rows="4"
                placeholder="अपने बारे में लिखें..."
            ></textarea>


            <button
                class="save-profile"
                onclick="saveProfile()"
            >
                💾 Save Profile
            </button>

        </div>


        <br>


        <!-- LOGOUT -->

        <button
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>

</div>


<script>


/* =========================
   AUTH FUNCTIONS
========================= */

function showSignup() {

    document
        .getElementById("loginBox")
        .style.display = "none";

    document
        .getElementById("signupBox")
        .style.display = "block";
}


function showLogin() {

    document
        .getElementById("signupBox")
        .style.display = "none";

    document
        .getElementById("loginBox")
        .style.display = "block";
}


/* SIGN UP */

function signup() {

    const name =
        document.getElementById("signupName").value.trim();

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value;


    if (name === "" || email === "" || password === "") {

        alert("सभी जानकारी भरें!");

        return;
    }


    if (password.length < 6) {

        alert("Password कम से कम 6 characters का होना चाहिए!");

        return;
    }


    const user = {

        name: name,
        email: email,
        password: password,
        bio: "Welcome to my Zuno profile! 🎉"

    };


    localStorage.setItem(
        "zunoUser",
        JSON.stringify(user)
    );


    alert("Account बन गया! 🎉 अब Login करें।");


    document.getElementById("signupName").value = "";
    document.getElementById("signupEmail").value = "";
    document.getElementById("signupPassword").value = "";


    showLogin();

}


/* LOGIN */

function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    const savedUser =
        localStorage.getItem("zunoUser");


    if (!savedUser) {

        alert("पहले Sign Up करके account बनाएँ!");

        return;
    }


    const user =
        JSON.parse(savedUser);


    if (
        email === user.email &&
        password === user.password
    ) {

        localStorage.setItem(
            "zunoLoggedIn",
            "true"
        );


        loadUser();


        document
            .getElementById("authPage")
            .style.display = "none";


        document
            .getElementById("homePage")
            .style.display = "block";


        alert("Login successful! 🎉");


    } else {

        alert("Email या Password गलत है!");

    }

}


/* LOGOUT */

function logout() {

    localStorage.removeItem(
        "zunoLoggedIn"
    );


    document
        .getElementById("homePage")
        .style.display = "none";


    document
        .getElementById("profilePage")
        .style.display = "none";


    document
        .getElementById("authPage")
        .style.display = "flex";


    showLogin();

}


/* =========================
   LOAD USER
========================= */

function loadUser() {

    const savedUser =
        localStorage.getItem("zunoUser");


    if (!savedUser) {
        return;
    }


    const user =
        JSON.parse(savedUser);


    document
        .getElementById("profileName")
        .textContent =
        user.name;


    document
        .getElementById("profileBio")
        .textContent =
        user.bio;

}


/* =========================
   AUTO LOGIN
========================= */

window.onload = function() {

    const loggedIn =
        localStorage.getItem("zunoLoggedIn");


    if (
        loggedIn === "true" &&
        localStorage.getItem("zunoUser")
    ) {

        loadUser();

        document
            .getElementById("authPage")
            .style.display = "none";

        document
            .getElementById("homePage")
            .style.display = "block";

    }

};


/* =========================
   CREATE POST
========================= */

function createPost() {

    const text =
        document
        .getElementById("postText")
        .value;


    if (text.trim() === "") {

        alert("पहले कुछ लिखें!");

        return;
    }


    const savedUser =
        localStorage.getItem("zunoUser");


    let username = "Zuno User";


    if (savedUser) {

        const user =
            JSON.parse(savedUser);

        username = user.name;

    }


    const post =
        document.createElement("div");


    post.className = "post";


    post.innerHTML = `

        <strong>
            👤 ${username}
        </strong>

        <p>
            ${text}
        </p>

        <div class="actions">

            <button class="like-btn">
                ❤️ Like
            </button>

            <button class="comment-open">
                💬 Comment
            </button>

            <button>
                ↗️ Share
            </button>

        </div>

        <div class="comment-box">

            <textarea
                rows="2"
                placeholder="Comment लिखें..."
            ></textarea>

            <button class="comment-btn">
                Post Comment
            </button>

            <div class="comments"></div>

        </div>
    `;


    document
        .getElementById("posts")
        .prepend(post);


    document
        .getElementById("postText")
        .value = "";


    updatePostCount();

}


/* =========================
   LIKE + COMMENT
========================= */

document.addEventListener(
    "click",
    function(event) {


        if (
            event.target.classList
            .contains("like-btn")
        ) {

            if (
                event.target.textContent
                .includes("Liked")
            ) {

                event.target.textContent =
                    "❤️ Like";

            } else {

                event.target.textContent =
                    "❤️ Liked";

            }

        }


        if (
            event.target.classList
            .contains("comment-open")
        ) {

            const post =
                event.target.closest(".post");

            const box =
                post.querySelector(".comment-box");


            if (box.style.display === "block") {

                box.style.display = "none";

            } else {

                box.style.display = "block";

            }

        }


        if (
            event.target.classList
            .contains("comment-btn")
        ) {

            const box =
                event.target.closest(".comment-box");

            const input =
                box.querySelector("textarea");

            const comments =
                box.querySelector(".comments");


            if (input.value.trim() === "") {

                alert("पहले Comment लिखें!");

                return;

            }


            const comment =
                document.createElement("div");


            comment.className = "comment";


            comment.textContent =
                "👤 " +
                getCurrentUserName() +
                ": " +
                input.value;


            comments.appendChild(comment);


            input.value = "";

        }

    }
);


/* =========================
   CURRENT USER NAME
========================= */

function getCurrentUserName() {

    const savedUser =
        localStorage.getItem("zunoUser");


    if (savedUser) {

        return JSON.parse(savedUser).name;

    }


    return "Zuno User";

}


/* =========================
   PROFILE
========================= */

function openProfile() {

    loadUser();

    document
        .getElementById("profilePage")
        .style.display = "block";


    updatePostCount();

}


function closeProfile() {

    document
        .getElementById("profilePage")
        .style.display = "none";

}


/* POST COUNT */

function updatePostCount() {

    const posts =
        document.querySelectorAll(
            "#posts .post"
        ).length;


    document
        .getElementById("postCount")
        .textContent = posts;

}


/* =========================
   EDIT PROFILE
========================= */

function showProfileEditor() {

    document
        .getElementById("profileEditor")
        .style.display = "block";


    document
        .getElementById("nameInput")
        .value =
        document
        .getElementById("profileName")
        .textContent;


    document
        .getElementById("bioInput")
        .value =
        document
        .getElementById("profileBio")
        .textContent;

}


/* SAVE PROFILE */

function saveProfile() {

    const name =
        document
        .getElementById("nameInput")
        .value.trim();


    const bio =
        document
        .getElementById("bioInput")
        .value.trim();


    if (name === "") {

        alert("अपना Name लिखें!");

        return;

    }


    if (bio === "") {

        alert("अपना Bio लिखें!");

        return;

    }


    const savedUser =
        localStorage.getItem("zunoUser");


    if (savedUser) {

        const user =
            JSON.parse(savedUser);


        user.name = name;
