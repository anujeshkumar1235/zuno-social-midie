<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zuno Social Media</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        button {
            cursor: pointer;
        }

        /* =====================
           LOGIN / SIGN UP
        ===================== */

        #authPage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
            text-align: center;
        }

        .auth-logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .auth-card h2 {
            font-size: 30px;
            margin: 25px 0;
        }

        .auth-card input {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 17px;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 12px;
            background: #1877f2;
            color: white;
            font-size: 18px;
        }

        .switch-btn {
            margin-top: 20px;
            border: none;
            background: none;
            color: #1877f2;
            font-size: 17px;
        }

        /* =====================
           HOME
        ===================== */

        #homePage {
            display: none;
        }

        header {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .profile-btn {
            border: none;
            background: none;
            font-size: 25px;
        }

        .post-box,
        .post {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .create-btn,
        .comment-btn,
        .edit-profile,
        .save-profile,
        .follow-btn,
        .logout-btn {
            margin-top: 10px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .create-btn,
        .comment-btn,
        .save-profile,
        .follow-btn {
            background: #1877f2;
            color: white;
        }

        .edit-profile {
            background: #1877f2;
            color: white;
        }

        .logout-btn {
            background: #e53935;
            color: white;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }

        .actions button {
            border: none;
            background: none;
            font-size: 16px;
        }

        .comment-box {
            display: none;
            margin-top: 12px;
        }

        .comment {
            background: #f2f2f2;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
        }

        /* =====================
           PROFILE
        ===================== */

        .profile-page {
            display: none;
            position: fixed;
            inset: 0;
            background: #f2f2f2;
            z-index: 1000;
            overflow-y: auto;
        }

        .back-btn {
            margin: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: white;
            font-size: 16px;
        }

        .profile-card {
            background: white;
            margin: 15px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .avatar {
            font-size: 70px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }

        .profile-stats div {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .profile-editor {
            display: none;
            margin-top: 25px;
            text-align: left;
        }

        .profile-editor label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .profile-editor input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

    </style>

</head>


<body>


<!-- ==================================================
     LOGIN / SIGN UP PAGE
================================================== -->

<div id="authPage">

    <div class="auth-card">

        <div class="auth-logo">
            Zuno
        </div>

        <p>
            आपका Social Media 🚀
        </p>


        <!-- LOGIN BOX -->

        <div id="loginBox">

            <h2>
                Login
            </h2>

            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
            >

            <button
                type="button"
                class="auth-btn"
                id="loginButton"
            >
                🔐 Login
            </button>

            <button
                type="button"
                class="switch-btn"
                id="openSignupButton"
            >
                नया account बनाएँ
            </button>

        </div>


        <!-- SIGN UP BOX -->

        <div
            id="signupBox"
            style="display: none;"
        >

            <h2>
                Create Account
            </h2>

            <input
                id="signupName"
                type="text"
                placeholder="आपका Name"
            >

            <input
                id="signupEmail"
                type="email"
                placeholder="Email"
            >

            <input
                id="signupPassword"
                type="password"
                placeholder="Password"
            >

            <button
                type="button"
                class="auth-btn"
                id="signupButton"
            >
                🚀 Sign Up
            </button>

            <button
                type="button"
                class="switch-btn"
                id="openLoginButton"
            >
                ← वापस Login
            </button>

        </div>

    </div>

</div>


<!-- ==================================================
     HOME PAGE
================================================== -->

<div id="homePage">


    <header>
        <div
    id="notificationPanel"
    style="
        display: none;
        background: white;
        margin: 10px 15px;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    "
>

    <h3>🔔 Notifications</h3>

    <p>❤️ किसी ने आपकी Post को Like किया।</p>

    <p>💬 किसी ने आपकी Post पर Comment किया।</p>

    <p>👥 किसी ने आपको Follow किया।</p>

        </div>

        <div class="logo">
    Zuno
</div>

<div>

    <button
        id="notificationButton"
        type="button">
        🔔
    </button>

    <button
        type="button"
        class="profile-btn"
        id="profileButton">
        👤
    </button>

 </div>

    </header>
    <!-- SEARCH -->
<div class="search-box">

    <input
        id="searchInput"
        type="search"
        placeholder="🔍 Search..."
    >

    <button
        type="button"
        id="searchButton">
        Search
    </button>

</div>

    <div class="post-box">

        <strong>
            क्या चल रहा है?
        </strong>

        <textarea
            id="postText"
            rows="3"
            placeholder="अपनी पोस्ट लिखें..."
        ></textarea>
        <input
    type="file"
    id="postImage"
    accept="image/*"
>

        <button
            type="button"
            class="create-btn"
            id="createPostButton"
        >
            ➕ Create Post
        </button>

    </div>


    <!-- POSTS -->

    <div id="posts">

        <div class="post">

            <strong>
                👤 Zuno
            </strong>

            <p>
                🎉 Welcome to Zuno!
            </p>

            <div class="actions">

                <button
                    type="button"
                    class="like-btn"
                >
                    ❤️ Like
                </button>

                <button
                    type="button"
                    class="comment-open"
                >
                    💬 Comment
                </button>

                <button type="button">
                    ↗️ Share
                </button>

            </div>


            <div class="comment-box">

                <textarea
                    rows="2"
                    placeholder="Comment लिखें..."
                ></textarea>

                <button
                    type="button"
                    class="comment-btn"
                >
                    Post Comment
                </button>

                <div class="comments"></div>

            </div>

        </div>

    </div>

</div>


<!-- ==================================================
     PROFILE PAGE
================================================== -->

<div
    id="profilePage"
    class="profile-page"
>

    <button
        type="button"
        class="back-btn"
        id="backButton"
    >
        ← वापस
    </button>


    <div class="profile-card">

        <div class="avatar">
            👤
        </div>


        <h2 id="profileName">
            Zuno User
        </h2>


        <p id="profileBio">
            Welcome to my Zuno profile! 🎉
        </p>


        <!-- STATS -->

        <div class="profile-stats">

            <div>

                <strong id="postCount">
                    0
                </strong>

                <span>
                    Posts
                </span>

            </div>


            <div>

                <strong id="followersCount">
                    0
                </strong>

                <span>
                    Followers
                </span>

            </div>


            <div>

                <strong id="followingCount">
                    0
                </strong>

                <span>
                    Following
                </span>

            </div>

        </div>


        <!-- FOLLOW -->

        <button
            type="button"
            class="follow-btn"
            id="followButton"
        >
            👥 Follow
        </button>


        <br>


        <!-- EDIT PROFILE -->

        <button
            type="button"
            class="edit-profile"
            id="editProfileButton"
        >
            ✏️ Edit Profile
        </button>


        <!-- PROFILE EDITOR -->

        <div
            id="profileEditor"
            class="profile-editor"
        >

            <label>
                आपका Name
            </label>

            <input
                id="nameInput"
                type="text"
                placeholder="अपना नाम लिखें"
            >


            <label>
                आपका Bio
            </label>

            <textarea
                id="bioInput"
                rows="4"
                placeholder="अपने बारे में लिखें..."
            ></textarea>


            <button
                type="button"
                class="save-profile"
                id="saveProfileButton"
            >
                💾 Save Profile
            </button>

        </div>


        <br>


        <!-- LOGOUT -->

        <button
            type="button"
            class="logout-btn"
            id="logoutButton"
        >
            🚪 Logout
        </button>

    </div>

</div>


<script>

/* ==================================================
   ELEMENTS
================================================== */

const authPage =
    document.getElementById("authPage");

const homePage =
    document.getElementById("homePage");

const loginBox =
    document.getElementById("loginBox");

const signupBox =
    document.getElementById("signupBox");


/* ==================================================
   LOGIN / SIGN UP PAGE SWITCH
================================================== */

document
    .getElementById("openSignupButton")
    .addEventListener("click", function() {

        loginBox.style.display = "none";

        signupBox.style.display = "block";

    });


document
    .getElementById("openLoginButton")
    .addEventListener("click", function() {

        signupBox.style.display = "none";

        loginBox.style.display = "block";

    });


/* ==================================================
   SIGN UP
================================================== */

document
    .getElementById("signupButton")
    .addEventListener("click", function() {

        const name =
            document
            .getElementById("signupName")
            .value
            .trim();


        const email =
            document
            .getElementById("signupEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("signupPassword")
            .value;


        if (
            name === "" ||
            email === "" ||
            password === ""
        ) {

            alert("सभी जानकारी भरें!");

            return;
        }


        if (password.length < 6) {

            alert(
                "Password कम से कम 6 characters का होना चाहिए!"
            );

            return;
        }


        const user = {

            name: name,

            email: email,

            password: password,

            bio: "Welcome to my Zuno profile! 🎉"

        };


        localStorage.setItem(
            "zunoUser",
            JSON.stringify(user)
        );


        alert(
            "Account बन गया! 🎉 अब Login करें।"
        );


        document
            .getElementById("signupName")
            .value = "";

        document
            .getElementById("signupEmail")
            .value = "";

        document
            .getElementById("signupPassword")
            .value = "";


        signupBox.style.display = "none";

        loginBox.style.display = "block";

    });


/* ==================================================
   LOGIN
================================================== */

document
    .getElementById("loginButton")
    .addEventListener("click", function() {

        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("loginPassword")
            .value;


        const savedUser =
            localStorage.getItem("zunoUser");


        if (!savedUser) {

            alert(
                "पहले नया account बनाएँ!"
            );

            return;
        }


        const user =
            JSON.parse(savedUser);


        if (
            email === user.email &&
            password === user.password
        ) {

            localStorage.setItem(
                "zunoLoggedIn",
                "true"
            );


            loadUser();


            authPage.style.display =
                "none";


            homePage.style.display =
                "block";


            alert(
                "Login successful! 🎉"
            );

        } else {

            alert(
                "Email या Password गलत है!"
            );

        }

    });


/* ==================================================
   LOAD USER
================================================== */

function loadUser() {

    const savedUser =
        localStorage.getItem("zunoUser");


    if (!savedUser) {
        return;
    }


    const user =
        JSON.parse(savedUser);


    document
        .getElementById("profileName")
        .textContent =
        user.name;


    document
        .getElementById("profileBio")
        .textContent =
        user.bio;

}


/* ==================================================
   AUTO LOGIN
================================================== */

window.addEventListener(
    "load",
    function() {

        const loggedIn =
            localStorage.getItem(
                "zunoLoggedIn"
            );


        const savedUser =
            localStorage.getItem(
                "zunoUser"
            );


        if (
            loggedIn === "true" &&
            savedUser
        ) {

            loadUser();

            authPage.style.display =
                "none";

            homePage.style.display =
                "block";

        }

    }
);


/* ==================================================
   LOGOUT
================================================== */

document
    .getElementById("logoutButton")
    .addEventListener("click", function() {

        localStorage.removeItem(
            "zunoLoggedIn"
        );


        document
            .getElementById("profilePage")
            .style.display = "none";


        homePage.style.display =
            "none";


        authPage.style.display =
            "flex";


        loginBox.style.display =
            "block";


        signupBox.style.display =
            "none";


        document
            .getElementById("loginEmail")
            .value = "";

        document
            .getElementById("loginPassword")
            .value = "";

    });


/* ==================================================
   CREATE POST
================================================== */

    document
    .getElementById("createPostButton")
    .addEventListener("click", function() {

        const text =
            document
                .getElementById("postText")
                .value
                .trim();

        const imageInput =
            document.getElementById("postImage");

        const imageFile =
            imageInput.files[0];

        if (text === "" && !imageFile) {

            alert("Text या Photo चुनें!");

            return;
        }

        const post =
            document.createElement("div");

        post.className = "post";

        const savedUser =
            localStorage.getItem("zunoUser");

        let username = "Zuno User";

        if (savedUser) {

            username =
                JSON.parse(savedUser).name;

        }

        const userName =
            document.createElement("strong");

        userName.textContent =
            "👤 " + username;

        const postText =
            document.createElement("p");

        postText.textContent =
            text;

        post.appendChild(userName);

        if (text !== "") {
            post.appendChild(postText);
        }

        if (imageFile) {

            const image =
                document.createElement("img");

            image.src =
                URL.createObjectURL(imageFile);

            image.style.width = "100%";
            image.style.maxHeight = "400px";
            image.style.objectFit = "contain";
            image.style.borderRadius = "12px";
            image.style.marginTop = "10px";

            post.appendChild(image);
        }

        const actions =
            document.createElement("div");

        actions.className = "actions";

        const like =
            document.createElement("button");

        like.className = "like-btn";
        like.textContent = "❤️ Like";
        
        const likeCount =
       document.createElement("span");

       likeCount.className = "like-count";
       likeCount.textContent = "0 Likes";

        const commentOpen =
            document.createElement("button");

        commentOpen.className = "comment-open";
        commentOpen.textContent = "💬 Comment";

        const share =
            document.createElement("button");

        share.textContent = "↗️ Share";
        
         actions.appendChild(like);
         actions.appendChild(likeCount);
         actions.appendChild(commentOpen);
         actions.appendChild(share);
        

        const commentBox =
            document.createElement("div");

        commentBox.className =
            "comment-box";

        const commentInput =
            document.createElement("textarea");

        commentInput.rows = 2;
        commentInput.placeholder =
            "Comment लिखें...";

        const commentButton =
            document.createElement("button");

        commentButton.className =
            "comment-btn";

        commentButton.type = "button";

        commentButton.textContent =
            "Post Comment";

        const comments =
            document.createElement("div");

        comments.className = "comments";

        commentBox.appendChild(commentInput);
        commentBox.appendChild(commentButton);
        commentBox.appendChild(comments);

        post.appendChild(actions);
        post.appendChild(commentBox);

        document
            .getElementById("posts")
            .prepend(post);

        document
            .getElementById("postText")
            .value = "";

        document
            .getElementById("postImage")
            .value = "";

    });
    document
    .getElementById("profileButton")
    .addEventListener("click", function() {

        document
            .getElementById("homePage")
            .style.display = "none";

        document
            .getElementById("profilePage")
            .style.display = "block";

        loadUser();

    });
    document
    .getElementById("backButton")
    .addEventListener("click", function() {

        document
            .getElementById("profilePage")
            .style.display = "none";

        document
            .getElementById("homePage")
            .style.display = "block";

    });
    
    document
    .getElementById("followButton")
    .addEventListener("click", function() {

        const button = this;

        if (
            button.textContent.trim() === "👥 Follow"
        ) {

            button.textContent = "✓ Following";

            document
                .getElementById("followersCount")
                .textContent = "1";

        } else {

            button.textContent = "👥 Follow";

            document
                .getElementById("followersCount")
                .textContent = "0";

        }

    });
    document
    .getElementById("editProfileButton")
    .addEventListener("click", function() {

        const savedUser =
            localStorage.getItem("zunoUser");

        if (savedUser) {

            const user =
                JSON.parse(savedUser);

            document
                .getElementById("nameInput")
                .value = user.name;

            document
                .getElementById("bioInput")
                .value = user.bio;
        }

        document
            .getElementById("profileEditor")
            .style.display = "block";

    });
    document
    .getElementById("saveProfileButton")
    .addEventListener("click", function() {

        const savedUser =
            localStorage.getItem("zunoUser");

        if (!savedUser) {
            return;
        }

        const user =
            JSON.parse(savedUser);

        user.name =
            document
                .getElementById("nameInput")
                .value
                .trim();

        user.bio =
            document
                .getElementById("bioInput")
                .value
                .trim();

        localStorage.setItem(
            "zunoUser",
            JSON.stringify(user)
        );

        loadUser();

        document
            .getElementById("profileEditor")
            .style.display = "none";

        alert("Profile Save हो गई! 🎉");

    });
    document
    .getElementById("posts")
    .addEventListener("click", function(event) {

        if (
            event.target.classList.contains("like-btn")
        ) {

            const post =
                event.target.closest(".post");

            const likeCount =
                post.querySelector(".like-count");

            let count =
                parseInt(
                    likeCount.textContent
                ) || 0;

            if (
                event.target.textContent.trim() === "❤️ Like"
            ) {

                event.target.textContent =
                    "❤️ Liked";

                count++;

            } else {

                event.target.textContent =
                    "❤️ Like";

                count--;

            }

            likeCount.textContent =
                count + (count === 1 ? " Like" : " Likes");

        }

    });
    document
    .getElementById("posts")
    .addEventListener("click", function(event) {

        if (
            event.target.classList.contains("comment-btn")
        ) {

            const commentBox =
                event.target.parentElement;

            const input =
                commentBox.querySelector("textarea");

            const comments =
                commentBox.querySelector(".comments");

            const text =
                input.value.trim();

            if (text === "") {
                alert("पहले Comment लिखें!");
                return;
            }

            const comment =
                document.createElement("p");

            comment.textContent = "💬 " + text;

            comments.appendChild(comment);

            input.value = "";

        }

    });
    document
    .getElementById("posts")
    .addEventListener("click", function(event) {

        if (
            event.target.classList.contains("comment-open")
        ) {

            const post =
                event.target.closest(".post");

            const commentBox =
                post.querySelector(".comment-box");

            if (
                commentBox.style.display === "block"
            ) {

                commentBox.style.display = "none";

            } else {

                commentBox.style.display = "block";

            }

        }

    });
    document
    .getElementById("posts")
    .addEventListener("click", function(event) {

        if (
            event.target.tagName === "BUTTON" &&
            event.target.textContent.includes("Share")
        ) {

            const post =
                event.target.closest(".post");

            const textElement =
                 post.querySelector("p");

            const postText =
                 textElement
                      ? textElement.textContent
                      : "📸 Zuno Photo Post";

            if (navigator.share) {

                navigator.share({
                    title: "Zuno Post",
                    text: postText
                });

            } else {

                navigator.clipboard.writeText(postText);

                alert("Post link/text copy हो गया! 📋");

            }

        }

    });
    document
    .getElementById("notificationButton")
    .addEventListener("click", function() {

        const panel =
            document.getElementById("notificationPanel");

        if (panel.style.display === "block") {

            panel.style.display = "none";

        } else {

            panel.style.display = "block";

        }

    });
    document
    .getElementById("searchButton")
    .addEventListener("click", function() {

        const searchText =
            document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();

        const posts =
            document.querySelectorAll(".post");

        posts.forEach(function(post) {

            const text =
                post.textContent.toLowerCase();

            if (
                searchText === "" ||
                text.includes(searchText)
            ) {
                post.style.display = "block";
            } else {
                post.style.display = "none";
            }

        });

    });
    document
    .getElementById("posts")
    .addEventListener("click", function(event) {

        if (
            event.target.textContent.includes("Share")
        ) {

            const post =
                event.target.closest(".post");

            const textElement =
                post.querySelector("p");

            const postText =
                textElement
                    ? textElement.textContent
                    : "📸 Zuno Photo Post";

            if (navigator.share) {

                navigator.share({
                    title: "Zuno Post",
                    text: postText
                });

            } else {

                navigator.clipboard.writeText(postText);

                alert("Post copy हो गई! 📋");

            }

        }

    });
</script>
</body>
</html>
