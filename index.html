<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuno Social Media</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        header {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .post-box, .post {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
        }

        .create-btn,
        .comment-btn {
            margin-top: 10px;
            padding: 10px 18px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }

        .actions button {
            border: none;
            background: none;
            font-size: 16px;
        }

        .comment-box {
            display: none;
            margin-top: 12px;
        }

        .comment {
            background: #f2f2f2;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Zuno</div>
    <div>🔔 👤</div>
</header>

<div class="post-box">
    <strong>क्या चल रहा है?</strong>

    <textarea id="postText" rows="3"
        placeholder="अपनी पोस्ट लिखें..."></textarea>

    <button class="create-btn" onclick="createPost()">
        ➕ Create Post
    </button>
</div>

<div id="posts">

    <div class="post">

        <strong>👤 Zuno User</strong>
        <p>🎉 Welcome to Zuno!</p>

        <div class="actions">
            <button class="like-btn">❤️ Like</button>
            <button class="comment-open">💬 Comment</button>
            <button>↗️ Share</button>
        </div>

        <div class="comment-box">
            <textarea rows="2"
                placeholder="Comment लिखें..."></textarea>

            <button class="comment-btn">
                Post Comment
            </button>

            <div class="comments"></div>
        </div>

    </div>

</div>

<script>

function createPost() {

    const text = document.getElementById("postText").value;

    if (text.trim() === "") {
        alert("पहले कुछ लिखें!");
        return;
    }

    const post = document.createElement("div");
    post.className = "post";

    post.innerHTML = `
        <strong>👤 Zuno User</strong>
        <p>${text}</p>

        <div class="actions">
            <button class="like-btn">❤️ Like</button>
            <button class="comment-open">💬 Comment</button>
            <button>↗️ Share</button>
        </div>

        <div class="comment-box">
            <textarea rows="2"
                placeholder="Comment लिखें..."></textarea>

            <button class="comment-btn">
                Post Comment
            </button>

            <div class="comments"></div>
        </div>
    `;

    document.getElementById("posts").prepend(post);
    document.getElementById("postText").value = "";
}


document.addEventListener("click", function(event) {

    /* LIKE */

    if (event.target.classList.contains("like-btn")) {

        if (event.target.textContent.includes("Liked")) {
            event.target.textContent = "❤️ Like";
        } else {
            event.target.textContent = "❤️ Liked";
        }
    }


    /* OPEN COMMENT */

    if (event.target.classList.contains("comment-open")) {

        const post = event.target.closest(".post");
        const box = post.querySelector(".comment-box");

        if (box.style.display === "block") {
            box.style.display = "none";
        } else {
            box.style.display = "block";
        }
    }


    /* POST COMMENT */

    if (event.target.classList.contains("comment-btn")) {

        const box = event.target.closest(".comment-box");
        const input = box.querySelector("textarea");
        const comments = box.querySelector(".comments");

        if (input.value.trim() === "") {
            alert("पहले Comment लिखें!");
            return;
        }

        const comment = document.createElement("div");
        comment.className = "comment";

        comment.innerHTML = "👤 Zuno User: " + input.value;

        comments.appendChild(comment);

        input.value = "";
    }

});

</script>

</body>
</html>
