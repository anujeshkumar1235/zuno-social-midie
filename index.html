<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuno Social Media</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        header {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .profile-btn {
            border: none;
            background: none;
            font-size: 25px;
            cursor: pointer;
        }

        .post-box,
        .post {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
        }

        .create-btn,
        .comment-btn,
        .edit-profile {
            margin-top: 10px;
            padding: 10px 18px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }

        .actions button {
            border: none;
            background: none;
            font-size: 16px;
            cursor: pointer;
        }

        .comment-box {
            display: none;
            margin-top: 12px;
        }

        .comment {
            background: #f2f2f2;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
        }

        /* Profile */

        .profile-page {
            display: none;
            position: fixed;
            inset: 0;
            background: #f2f2f2;
            z-index: 1000;
            overflow-y: auto;
        }

        .back-btn {
            margin: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: white;
            font-size: 16px;
            cursor: pointer;
        }

        .profile-card {
            background: white;
            margin: 15px;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .avatar {
            font-size: 70px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
        }

        .profile-stats div {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Zuno</div>

    <div>
        🔔
        <button class="profile-btn" onclick="openProfile()">👤</button>
    </div>
</header>


<!-- Create Post -->

<div class="post-box">

    <strong>क्या चल रहा है?</strong>

    <textarea
        id="postText"
        rows="3"
        placeholder="अपनी पोस्ट लिखें..."
    ></textarea>

    <button class="create-btn" onclick="createPost()">
        ➕ Create Post
    </button>

</div>


<!-- Posts -->

<div id="posts">

    <div class="post">

        <strong>👤 Zuno User</strong>

        <p>🎉 Welcome to Zuno!</p>

        <div class="actions">

            <button class="like-btn">
                ❤️ Like
            </button>

            <button class="comment-open">
                💬 Comment
            </button>

            <button>
                ↗️ Share
            </button>

        </div>

        <div class="comment-box">

            <textarea
                rows="2"
                placeholder="Comment लिखें..."
            ></textarea>

            <button class="comment-btn">
                Post Comment
            </button>

            <div class="comments"></div>

        </div>

    </div>

</div>


<!-- Profile Page -->

<div id="profilePage" class="profile-page">

    <button class="back-btn" onclick="closeProfile()">
        ← वापस
    </button>

    <div class="profile-card">

        <div class="avatar">
            👤
        </div>

        <h2 id="profileName">
            Zuno User
        </h2>

        <p>
            Welcome to my Zuno profile! 🎉
        </p>

        <div class="profile-stats">

            <div>
                <strong id="postCount">0</strong>
                <span>Posts</span>
            </div>

            <div>
                <strong>0</strong>
                <span>Followers</span>
            </div>

            <div>
                <strong>0</strong>
                <span>Following</span>
            </div>

        </div>

        <button class="edit-profile" onclick="editProfile()">
            ✏️ Edit Profile
        </button>

    </div>

</div>


<script>

function createPost() {

    const text =
        document.getElementById("postText").value;

    if (text.trim() === "") {

        alert("पहले कुछ लिखें!");

        return;
    }

    const post =
        document.createElement("div");

    post.className = "post";

    post.innerHTML = `

        <strong>👤 Zuno User</strong>

        <p>${text}</p>

        <div class="actions">

            <button class="like-btn">
                ❤️ Like
            </button>

            <button class="comment-open">
                💬 Comment
            </button>

            <button>
                ↗️ Share
            </button>

        </div>

        <div class="comment-box">

            <textarea
                rows="2"
                placeholder="Comment लिखें..."
            ></textarea>

            <button class="comment-btn">
                Post Comment
            </button>

            <div class="comments"></div>

        </div>
    `;

    document
        .getElementById("posts")
        .prepend(post);

    document
        .getElementById("postText")
        .value = "";
}


/* Like + Comment */

document.addEventListener("click", function(event) {

    if (
        event.target.classList
        .contains("like-btn")
    ) {

        if (
            event.target.textContent
            .includes("Liked")
        ) {

            event.target.textContent =
                "❤️ Like";

        } else {

            event.target.textContent =
                "❤️ Liked";
        }
    }


    if (
        event.target.classList
        .contains("comment-open")
    ) {

        const post =
            event.target.closest(".post");

        const box =
            post.querySelector(".comment-box");

        if (box.style.display === "block") {

            box.style.display = "none";

        } else {

            box.style.display = "block";
        }
    }


    if (
        event.target.classList
        .contains("comment-btn")
    ) {

        const box =
            event.target.closest(".comment-box");

        const input =
            box.querySelector("textarea");

        const comments =
            box.querySelector(".comments");

        if (input.value.trim() === "") {

            alert("पहले Comment लिखें!");

            return;
        }

        const comment =
            document.createElement("div");

        comment.className = "comment";

        comment.textContent =
            "👤 Zuno User: " +
            input.value;

        comments.appendChild(comment);

        input.value = "";
    }

});


/* Profile */

function openProfile() {

    document
        .getElementById("profilePage")
        .style.display = "block";

    const posts =
        document.querySelectorAll(
            "#posts .post"
        ).length;

    document
        .getElementById("postCount")
        .textContent = posts;
}


function closeProfile() {

    document
        .getElementById("profilePage")
        .style.display = "none";
}


function editProfile() {

    const name =
        prompt("अपना नाम लिखें:");

    if (
        name &&
        name.trim() !== ""
    ) {

        document
            .getElementById("profileName")
            .textContent = name;
    }
}

</script>

</body>
</html>
