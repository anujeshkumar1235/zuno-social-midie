<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuno</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        header {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .post-box {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
        }

        .post {
            background: white;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
        }

        .actions {
            margin-top: 15px;
            display: flex;
            gap: 20px;
        }

        button {
            border: none;
            background: none;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Zuno</div>
        <div>🔔 👤</div>
    </header>

    <div class="post-box">
        <strong>क्या चल रहा है?</strong>
        <p>अपनी पहली पोस्ट बनाएँ ✨</p>
        <button>➕ Create Post</button>
    </div>

    <div class="post">
        <strong>👤 Zuno User</strong>
        <p>🎉 Welcome to Zuno!</p>

        <div class="actions">
            <button>❤️ Like</button>
            <button>💬 Comment</button>
            <button>↗️ Share</button>
        </div>
    </div>

</body>
</html>
