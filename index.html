<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuno - Social Media</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        header {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .icons {
            font-size: 22px;
        }

        .create-post {
            background: white;
            margin: 15px auto;
            padding: 15px;
            max-width: 600px;
            border-radius: 12px;
        }

        .post-box {
            padding: 12px;
            background: #f2f2f2;
            border-radius: 20px;
            color: #777;
        }

        .post {
            background: white;
            max-width: 600px;
            margin: 15px auto;
            padding: 15px;
            border-radius: 12px;
        }

        .user {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .post-text {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .actions {
            border-top: 1px solid #ddd;
            padding-top: 12px;
            display: flex;
            gap: 30px;
        }

        button {
            border: none;
            background: none;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Zuno</div>
        <div class="icons">🔔 👤</div>
    </header>

    <div class="create-post">
        <div class="post-box">What's happening?</div>
    </div>

    <div class="post">
        <div class="user">👤 Zuno User</div>

        <div class="post-text">
            मेरी पहली Zuno Post 🎉
        </div>

        <div class="actions">
            <button>❤️ Like</button>
            <button>💬 Comment</button>
            <button>↗️ Share</button>
        </div>
    </div>

</body>
</html>
